---
name: Validate configuration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation tools
        run: python -m pip install ansible-core==2.21.0 ansible-lint==25.8.2 yamllint==1.37.1

      - name: Lint YAML
        run: yamllint --strict .

      - name: Lint Ansible
        run: ansible-lint --offline ansible/playbooks ansible/roles ansible/tests

      - name: Check playbook syntax
        run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook "$playbook" --syntax-check
          done

      - name: Check Quadlet definitions
        run: ansible-playbook ansible/tests/quadlets.yml

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.8
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        run: tofu -chdir=terraform fmt -check -recursive

      - name: Initialize provider for validation
        run: tofu -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate OpenTofu
        run: tofu -chdir=terraform validate

      - name: Test VM definitions with a mock provider
        run: tofu -chdir=terraform test

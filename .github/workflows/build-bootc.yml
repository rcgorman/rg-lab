---
name: Build bootc image

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches:
      - main
    paths:
      - bootc/**
      - .containerignore
      - .github/workflows/build-bootc.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, validate, and rechunk image
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v13
    with:
      containerfile: bootc/Containerfile
      image-name: alma10-bootc
      image-path: ${{ github.repository_owner }}/rg-lab
      image-description: rg-lab AlmaLinux 10 bootc image
      previous-image: ghcr.io/${{ github.repository_owner }}/rg-lab/alma10-bootc:latest
      platforms: amd64
      generate-sbom: true
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ github.actor }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      id-token: write

  cis:
    name: Verify CIS findings
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CIS report
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          podman pull "${IMAGE_REF}"
          container=$(podman create "${IMAGE_REF}")
          trap 'podman rm "$container"' EXIT
          podman cp "$container:/usr/share/rg-lab/cis-server-l1.html" ./cis-server-l1.html
          podman cp "$container:/usr/share/rg-lab/cis-server-l1-results.xml" ./cis-server-l1-results.xml

      - name: Check CIS findings against reviewed baseline
        run: python3 bootc/scripts/check-cis-report.py cis-server-l1.html bootc/cis-expected-findings.txt

      - name: Upload CIS report
        uses: actions/upload-artifact@v7
        with:
          name: cis-server-l1
          path: |
            cis-server-l1.html
            cis-server-l1-results.xml
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote validated image
    needs:
      - build
      - cis
    uses: AlmaLinux/atomic-ci/.github/workflows/retag-image.yml@v13
    with:
      image: ${{ needs.build.outputs.image-ref }}
      digest: ${{ needs.build.outputs.digest }}
      tag: |
        latest
        sha-${{ github.sha }}
        build-${{ github.run_id }}-${{ github.run_attempt }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ github.actor }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write

---
name: Build bootc image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - bootc/**
      - .github/workflows/build-bootc.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTAINERFILE: bootc/Containerfile
  BUILD_CONTEXT: bootc
  DEST_REGISTRY_HOST: ghcr.io
  DEST_IMAGE: ${{ github.repository_owner }}/rg-lab/alma10-bootc
  TAGLIST: latest sha-${{ github.sha }}
  REGISTRY_AUTH_FILE: /tmp/containers-auth.json

jobs:
  build:
    name: Build and push bootc image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /opt/hostedtoolcache \
            /opt/az \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.DEST_REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: ${{ env.REGISTRY_AUTH_FILE }}

      - name: Build bootc image
        run: |
          image_ref="${DEST_REGISTRY_HOST}/${DEST_IMAGE}"
          tag_args=()
          for tag in ${TAGLIST}; do
            tag_args+=(--tag "${image_ref}:${tag}")
          done

          sudo env REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device=/dev/fuse \
            --arch=amd64 \
            --pull=newer \
            --root /mnt/containers-storage \
            "${tag_args[@]}" \
            --file "${CONTAINERFILE}" \
            "${BUILD_CONTEXT}"

      - name: Push image tags
        run: |
          image_ref="${DEST_REGISTRY_HOST}/${DEST_IMAGE}"
          for tag in ${TAGLIST}; do
            sudo env REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" podman --root /mnt/containers-storage push "${image_ref}:${tag}"
          done

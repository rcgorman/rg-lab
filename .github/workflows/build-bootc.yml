---
name: Build bootc image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - bootc/**
      - .github/workflows/build-bootc.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/rg-lab
  IMAGE_NAME: alma10-bootc
  REGISTRY_AUTH_FILE: /tmp/containers-auth.json

jobs:
  build:
    name: Build and push bootc image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /opt/hostedtoolcache \
            /opt/az \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Set image tags
        run: |
          image_ref="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE_REF=${image_ref}:latest" >> "${GITHUB_ENV}"
          echo "IMAGE_SHA_REF=${image_ref}:sha-${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: ${{ env.REGISTRY_AUTH_FILE }}

      - name: Build bootc image
        run: |
          sudo env REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device=/dev/fuse \
            --arch=amd64 \
            --pull=newer \
            --root /mnt/containers-storage \
            --tag "${IMAGE_REF}" \
            --tag "${IMAGE_SHA_REF}" \
            --file bootc/Containerfile \
            bootc

      - name: Push latest tag
        run: sudo env REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" podman --root /mnt/containers-storage push "${IMAGE_REF}"

      - name: Push commit tag
        run: sudo env REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" podman --root /mnt/containers-storage push "${IMAGE_SHA_REF}"
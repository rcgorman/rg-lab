---
- name: Deploy OpenCloud with OnlyOffice
  hosts: data_hosts
  become: true
  vars:
    podman_secrets:
      opencloud_admin_password: "{{ lookup('env', 'OPENCLOUD_ADMIN_PASSWORD') }}"
      onlyoffice_jwt_secret: "{{ lookup('env', 'ONLYOFFICE_JWT_SECRET') }}"
  roles:
    - podman_secrets
    - opencloud
    - podman_quadlet

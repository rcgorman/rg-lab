---
- name: Ensure Podman secret values are present
  ansible.builtin.assert:
    that:
      - item.value | length > 0
    fail_msg: "Missing value for Podman secret {{ item.key }}"
  loop: "{{ podman_secrets_values | dict2items }}"
  no_log: true

- name: Check whether Podman secrets exist
  ansible.builtin.command:
    argv: [podman, secret, exists, "{{ item.key }}"]
  register: podman_secrets_inspect
  changed_when: false
  check_mode: false
  failed_when: podman_secrets_inspect.rc not in [0, 1]
  loop: "{{ podman_secrets_values | dict2items }}"
  no_log: true

- name: Create missing or explicitly replaced Podman secrets
  ansible.builtin.command:
    argv: "{{ ['podman', 'secret', 'create'] + (['--replace'] if podman_secrets_recreate | bool else []) + [item.item.key, '-'] }}"
    stdin: "{{ item.item.value }}"
    stdin_add_newline: false
  register: podman_secrets_create
  changed_when: true
  when: item.rc != 0 or podman_secrets_recreate | bool
  loop: "{{ podman_secrets_inspect.results }}"
  no_log: true

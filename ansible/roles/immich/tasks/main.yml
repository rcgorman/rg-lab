---
- name: Create immich secrets
  ansible.builtin.include_role:
    name: podman_secrets
  vars:
    podman_secrets_values:
      immich_db_password: "{{ lookup('env', 'IMMICH_DB_PASSWORD') }}"

- name: Deploy immich Quadlets
  ansible.builtin.include_role:
    name: podman_quadlet
  vars:
    podman_quadlet_restart_required: "{{ podman_secrets_create.changed }}"
    podman_quadlet_units:
      - name: immich.network
        content: |
          [Unit]
          Description=Immich bridge network

          [Network]
          NetworkName=immich

      - name: immich-library.volume
        content: |
          [Unit]
          Description=Immich library volume

          [Volume]
          VolumeName=immich-library
          Type=nfs
          Device=10.6.13.5:/mnt/Storage/immich
          Options=rw

      - name: immich-model-cache.volume
        content: |
          [Unit]
          Description=Immich model cache volume

          [Volume]
          VolumeName=immich-model-cache

      - name: immich-postgres.volume
        content: |
          [Unit]
          Description=Immich Postgres data volume

          [Volume]
          VolumeName=immich-postgres

      - name: immich-redis.container
        content: |
          [Unit]
          Description=Immich Redis

          [Container]
          ContainerName=immich_redis
          Image=docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
          UserNS=auto
          Network=immich.network
          NetworkAlias=immich-redis
          HealthCmd=redis-cli ping || exit 1

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

      - name: immich-database.container
        content: |
          [Unit]
          Description=Immich Postgres

          [Container]
          ContainerName=immich_postgres
          Image=ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          UserNS=auto
          Network=immich.network
          NetworkAlias=immich-database
          Environment=POSTGRES_PASSWORD_FILE=/run/secrets/immich_db_password
          Environment=POSTGRES_USER=postgres
          Environment=POSTGRES_DB=immich
          Environment=POSTGRES_INITDB_ARGS=--data-checksums
          Volume=immich-postgres.volume:/var/lib/postgresql/data:idmap
          ShmSize=128m
          Secret=immich_db_password,target=/run/secrets/immich_db_password

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

      - name: immich-machine-learning.container
        content: |
          [Unit]
          Description=Immich Machine Learning

          [Container]
          ContainerName=immich_machine_learning
          Image=ghcr.io/immich-app/immich-machine-learning@sha256:390453a571ca73b563cc3d9a12a37a4d71217b12608de72f26884f5e2ebc4896
          UserNS=auto
          Pull=newer
          Network=immich.network
          NetworkAlias=immich-machine-learning
          Environment=TZ=America/New_York
          Environment=UPLOAD_LOCATION=./library
          Environment=DB_DATA_LOCATION=./postgres
          Environment=IMMICH_VERSION=v3
          Environment=DB_HOSTNAME=immich-database
          Environment=DB_USERNAME=postgres
          Environment=DB_PASSWORD_FILE=/run/secrets/immich_db_password
          Environment=DB_DATABASE_NAME=immich
          Environment=REDIS_HOSTNAME=immich-redis
          Volume=immich-model-cache.volume:/cache:idmap
          Secret=immich_db_password,target=/run/secrets/immich_db_password

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

      - name: immich-server.container
        content: |
          [Unit]
          Description=Immich Server

          [Container]
          ContainerName=immich_server
          Image=ghcr.io/immich-app/immich-server@sha256:6b0eaf8cfea6d4d6f86a45dfd0c9e3b068ed4493d8b7fa1efeca4cc87792fbe8
          User=3000:3000
          Pull=newer
          Network=immich.network
          PublishPort=2283:2283
          NetworkAlias=immich-server
          Environment=TZ=America/New_York
          Environment=UPLOAD_LOCATION=./library
          Environment=DB_DATA_LOCATION=./postgres
          Environment=IMMICH_VERSION=v3
          Environment=DB_HOSTNAME=immich-database
          Environment=DB_USERNAME=postgres
          Environment=DB_PASSWORD_FILE=/run/secrets/immich_db_password
          Environment=DB_DATABASE_NAME=immich
          Environment=REDIS_HOSTNAME=immich-redis
          Volume=immich-library.volume:/data
          Secret=immich_db_password,target=/run/secrets/immich_db_password

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

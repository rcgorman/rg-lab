---
- name: Validate Immich secret configuration
  ansible.builtin.assert:
    that:
      - lookup('env', 'IMMICH_DB_PASSWORD') | length > 0
    fail_msg: Missing value for Podman secret immich_db_password
  no_log: true

- name: Deploy Immich with the Podman system role
  ansible.builtin.include_role:
    name: fedora.linux_system_roles.podman
  vars:
    podman_run_as_user: root
    # Quadlet Pull= controls image acquisition; do not force-pull mutable tags.
    podman_pull_image: false
    podman_secrets:
      - name: immich_db_password
        data: "{{ lookup('env', 'IMMICH_DB_PASSWORD') }}"
        force: "{{ podman_secrets_recreate | default(false) | bool }}"
        skip_existing: "{{ not (podman_secrets_recreate | default(false) | bool) }}"
        restarts:
          - immich-database
          - immich-machine-learning
          - immich-server
    # Dependencies must be listed before the containers that use them.
    podman_quadlet_specs:
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich.network.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-library.volume.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-model-cache.volume.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-postgres.volume.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-redis.container.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-database.container.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-machine-learning.container.j2"
      - template_src: "{{ playbook_dir }}/../roles/immich/templates/immich-server.container.j2"

---
- name: Create vaultwarden secrets
  ansible.builtin.include_role:
    name: podman_secrets
  vars:
    podman_secrets_values:
      vaultwarden_admin_token: "{{ lookup('env', 'VAULTWARDEN_ADMIN_TOKEN') }}"

- name: Deploy vaultwarden Quadlets
  ansible.builtin.include_role:
    name: podman_quadlet
  vars:
    podman_quadlet_restart_required: "{{ podman_secrets_create.changed }}"
    podman_quadlet_units:
      - name: vaultwarden.network
        content: |
          [Unit]
          Description=Vaultwarden bridge network

          [Network]
          NetworkName=vaultwarden

      - name: vaultwarden-data.volume
        content: |
          [Unit]
          Description=Vaultwarden data volume

          [Volume]
          VolumeName=vaultwarden-data

      - name: vaultwarden.container
        content: |
          [Unit]
          Description=Vaultwarden

          [Container]
          ContainerName=vaultwarden
          Image=docker.io/vaultwarden/server@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
          UserNS=auto
          Pull=newer
          Network=vaultwarden.network
          PublishPort=18080:80
          Environment=TZ=America/New_York
          Environment=DOMAIN=https://vault.internal.gormantech.com
          Environment=SIGNUPS_ALLOWED={{ vaultwarden_signups_allowed | default(false) | bool | lower }}
          Environment=INVITATION_ORG_NAME=GormanTech
          Environment=WEBSOCKET_ENABLED=true
          Environment=WEB_VAULT_ENABLED=true
          Environment=SHOW_PASSWORD_HINT=false
          Environment=LOG_LEVEL=info
          Secret=vaultwarden_admin_token,type=env,target=ADMIN_TOKEN
          Volume=vaultwarden-data.volume:/data:idmap

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

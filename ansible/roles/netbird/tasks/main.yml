---
- name: Check NetBird status
  ansible.builtin.command:
    cmd: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false

- name: Enroll host with NetBird setup key
  ansible.builtin.command:
    cmd: >-
      netbird up
      --setup-key {{ netbird_setup_key }}
      --management-url https://netbird.gormantech.com
  when: "'NetBird IP:' not in netbird_status.stdout"
  no_log: true

- name: Check final NetBird status
  ansible.builtin.command:
    cmd: netbird status
  register: final_status
  changed_when: false

- name: Show NetBird IP
  ansible.builtin.debug:
    msg: "{{ final_status.stdout_lines | select('match', '^NetBird IP:') | list }}"

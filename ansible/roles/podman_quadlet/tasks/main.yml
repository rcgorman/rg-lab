---
- name: Ensure quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render quadlet units
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/containers/systemd/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ podman_quadlet_units }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_quadlet_render

# Always reload so a rerun also recovers an interrupted deployment.
- name: Generate systemd services from Quadlets
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false

- name: Reset failed quadlet services
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ item.name | regex_replace('\\.container$', '.service') }}"
  loop: "{{ podman_quadlet_units | selectattr('name', 'search', '\\.container$') | list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Reconcile quadlet services
  ansible.builtin.systemd:
    name: "{{ item.name | regex_replace('\\.container$', '.service') }}"
    state: "{{ 'restarted' if podman_quadlet_render.changed or podman_quadlet_restart_required | bool else 'started' }}"
  loop: "{{ podman_quadlet_units | selectattr('name', 'search', '\\.container$') | list }}"
  loop_control:
    label: "{{ item.name }}"

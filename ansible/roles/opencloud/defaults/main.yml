---
opencloud_environment:
  - TZ=America/New_York
  - OC_URL=https://cloud.internal.gormantech.com
  - OC_LOG_LEVEL=info
  - OC_LOG_COLOR=false
  - OC_LOG_PRETTY=false
  - PROXY_TLS=false
  - PROXY_HTTP_ADDR=0.0.0.0:9200
  - OC_INSECURE=false
  - PROXY_ENABLE_BASIC_AUTH=false
  - IDM_CREATE_DEMO_USERS=false
  - FRONTEND_ARCHIVER_MAX_SIZE=10000000000
  - FRONTEND_CHECK_FOR_UPDATES=true
  - PROXY_CSP_CONFIG_FILE_LOCATION=/etc/opencloud/csp.yaml
  - OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD=true
  - OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD=false
  - OC_PASSWORD_POLICY_DISABLED=false
  - OC_PASSWORD_POLICY_MIN_CHARACTERS=8
  - OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS=1
  - OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS=1
  - OC_PASSWORD_POLICY_MIN_DIGITS=1
  - OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS=1
  - OC_DEFAULT_LANGUAGE=en
  - OC_ADD_RUN_SERVICES=collaboration
  - FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR=eu.opencloud.api.collaboration
  - GRAPH_AVAILABLE_ROLES=b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6
  - COLLABORATION_WOPI_SRC=https://cloud.internal.gormantech.com
  - COLLABORATION_APP_NAME=OnlyOffice
  - COLLABORATION_APP_PRODUCT=OnlyOffice
  - COLLABORATION_APP_ADDR=https://office.internal.gormantech.com
  - COLLABORATION_APP_ICON=https://office.internal.gormantech.com/web-apps/apps/documenteditor/main/resources/img/favicon.ico
  - COLLABORATION_APP_INSECURE=false
  - COLLABORATION_CS3API_DATAGATEWAY_INSECURE=false
  - COLLABORATION_APP_PROOF_DISABLE=true

opencloud_quadlet_units:
  - name: opencloud.network
    enabled: false
    sections:
      - name: Unit
        options:
          Description: OpenCloud bridge network
      - name: Network
        options:
          NetworkName: opencloud

  - name: opencloud-data.volume
    enabled: false
    sections:
      - name: Unit
        options:
          Description: OpenCloud data volume
      - name: Volume
        options:
          VolumeName: opencloud-data
          Type: nfs
          Device: 10.6.13.5:/mnt/Storage/opencloud
          Options: rw

  - name: onlyoffice-data.volume
    enabled: false
    sections:
      - name: Unit
        options:
          Description: OnlyOffice application data volume
      - name: Volume
        options:
          VolumeName: onlyoffice-data

  - name: onlyoffice-lib.volume
    enabled: false
    sections:
      - name: Unit
        options:
          Description: OnlyOffice library data volume
      - name: Volume
        options:
          VolumeName: onlyoffice-lib

  - name: onlyoffice-postgres.volume
    enabled: false
    sections:
      - name: Unit
        options:
          Description: OnlyOffice internal Postgres volume
      - name: Volume
        options:
          VolumeName: onlyoffice-postgres

  - name: onlyoffice-rabbitmq.volume
    enabled: false
    sections:
      - name: Unit
        options:
          Description: OnlyOffice internal RabbitMQ volume
      - name: Volume
        options:
          VolumeName: onlyoffice-rabbitmq

  - name: onlyoffice.container
    sections:
      - name: Unit
        options:
          Description: OnlyOffice Document Server
          Requires:
            - opencloud-network.service
            - onlyoffice-data-volume.service
            - onlyoffice-lib-volume.service
            - onlyoffice-postgres-volume.service
            - onlyoffice-rabbitmq-volume.service
          After:
            - opencloud-network.service
            - onlyoffice-data-volume.service
            - onlyoffice-lib-volume.service
            - onlyoffice-postgres-volume.service
            - onlyoffice-rabbitmq-volume.service
      - name: Container
        options:
          ContainerName: onlyoffice
          Image: docker.io/onlyoffice/documentserver:9.3.1
          AutoUpdate: registry
          Pull: newer
          Network: opencloud.network
          NetworkAlias: onlyoffice
          DNS: 10.6.13.1
          PublishPort: "18081:80"
          ShmSize: 1g
          Environment:
            - TZ=America/New_York
            - WOPI_ENABLED=true
            - JWT_ENABLED=true
            - JWT_HEADER=AuthorizationJwt
            - JWT_IN_BODY=true
            - ALLOW_PRIVATE_IP_ADDRESS=true
            - USE_UNAUTHORIZED_STORAGE=false
          Secret: onlyoffice_jwt_secret,type=env,target=JWT_SECRET
          Volume:
            - onlyoffice-data.volume:/var/www/onlyoffice/Data
            - onlyoffice-lib.volume:/var/lib/onlyoffice
            - onlyoffice-postgres.volume:/var/lib/postgresql
            - onlyoffice-rabbitmq.volume:/var/lib/rabbitmq
          HealthCmd: curl --fail http://localhost/healthcheck || exit 1
          HealthInterval: 30s
          HealthRetries: 5
          HealthStartPeriod: 120s
          HealthTimeout: 10s
      - name: Service
        options:
          Restart: always
      - name: Install
        options:
          WantedBy: multi-user.target

  - name: opencloud.container
    sections:
      - name: Unit
        options:
          Description: OpenCloud
          Requires:
            - opencloud-network.service
            - opencloud-data-volume.service
            - onlyoffice.service
          After:
            - opencloud-network.service
            - opencloud-data-volume.service
            - onlyoffice.service
      - name: Container
        options:
          ContainerName: opencloud
          Image: docker.io/opencloudeu/opencloud:7.2.4
          User: "3001:3001"
          AutoUpdate: registry
          Pull: newer
          Network: opencloud.network
          NetworkAlias: opencloud
          DNS: 10.6.13.1
          PublishPort: "9200:9200"
          Entrypoint: /bin/sh
          Exec: -c "opencloud init || true; opencloud server"
          Environment: "{{ opencloud_environment }}"
          Secret: opencloud_admin_password,type=env,target=IDM_ADMIN_PASSWORD
          Volume:
            - /srv/quadlet/opencloud:/etc/opencloud:Z
            - opencloud-data.volume:/var/lib/opencloud
            - /srv/quadlet/opencloud/apps:/var/lib/opencloud/web/assets/apps:Z
      - name: Service
        options:
          Restart: always
      - name: Install
        options:
          WantedBy: multi-user.target

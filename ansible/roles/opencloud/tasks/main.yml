---
- name: Create opencloud secrets
  ansible.builtin.include_role:
    name: podman_secrets
  vars:
    podman_secrets_values:
      opencloud_admin_password: "{{ lookup('env', 'OPENCLOUD_ADMIN_PASSWORD') }}"
      onlyoffice_jwt_secret: "{{ lookup('env', 'ONLYOFFICE_JWT_SECRET') }}"

- name: Ensure OpenCloud config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "3001"
    group: "3001"
    mode: "0755"
  loop:
    - /srv/quadlet/opencloud
    - /srv/quadlet/opencloud/apps

- name: Install OpenCloud content security policy
  ansible.builtin.template:
    src: csp.yaml.j2
    dest: /srv/quadlet/opencloud/csp.yaml
    owner: "3001"
    group: "3001"
    mode: "0644"
  register: opencloud_csp

- name: Install OpenCloud application registry
  ansible.builtin.template:
    src: app-registry.yaml.j2
    dest: /srv/quadlet/opencloud/app-registry.yaml
    owner: "3001"
    group: "3001"
    mode: "0644"
  register: opencloud_app_registry

- name: Ensure OpenCloud config ownership
  ansible.builtin.file:
    path: /srv/quadlet/opencloud
    state: directory
    owner: "3001"
    group: "3001"
    recurse: true
  register: opencloud_config_ownership

- name: Deploy opencloud Quadlets
  ansible.builtin.include_role:
    name: podman_quadlet
  vars:
    podman_quadlet_restart_required: >-
      {{ podman_secrets_create.changed or opencloud_csp.changed
         or opencloud_app_registry.changed or opencloud_config_ownership.changed }}
    podman_quadlet_units:
      - name: opencloud.network
        content: |
          [Unit]
          Description=OpenCloud bridge network

          [Network]
          NetworkName=opencloud

      - name: opencloud-data.volume
        content: |
          [Unit]
          Description=OpenCloud data volume

          [Volume]
          VolumeName=opencloud-data
          Type=nfs
          Device=10.6.13.5:/mnt/Storage/opencloud
          Options=rw

      - name: onlyoffice-data.volume
        content: |
          [Unit]
          Description=OnlyOffice application data volume

          [Volume]
          VolumeName=onlyoffice-data

      - name: onlyoffice-lib.volume
        content: |
          [Unit]
          Description=OnlyOffice library data volume

          [Volume]
          VolumeName=onlyoffice-lib

      - name: onlyoffice-postgres.volume
        content: |
          [Unit]
          Description=OnlyOffice internal Postgres volume

          [Volume]
          VolumeName=onlyoffice-postgres

      - name: onlyoffice-rabbitmq.volume
        content: |
          [Unit]
          Description=OnlyOffice internal RabbitMQ volume

          [Volume]
          VolumeName=onlyoffice-rabbitmq

      - name: onlyoffice.container
        content: |
          [Unit]
          Description=OnlyOffice Document Server

          [Container]
          ContainerName=onlyoffice
          Image=docker.io/onlyoffice/documentserver:9.3.1
          Pull=newer
          Network=opencloud.network
          NetworkAlias=onlyoffice
          DNS=10.6.13.1
          PublishPort=18081:80
          ShmSize=1g
          Environment=TZ=America/New_York
          Environment=WOPI_ENABLED=true
          Environment=JWT_ENABLED=true
          Environment=JWT_HEADER=AuthorizationJwt
          Environment=JWT_IN_BODY=true
          Environment=ALLOW_PRIVATE_IP_ADDRESS=true
          Environment=USE_UNAUTHORIZED_STORAGE=false
          Secret=onlyoffice_jwt_secret,type=env,target=JWT_SECRET
          Volume=onlyoffice-data.volume:/var/www/onlyoffice/Data
          Volume=onlyoffice-lib.volume:/var/lib/onlyoffice
          Volume=onlyoffice-postgres.volume:/var/lib/postgresql
          Volume=onlyoffice-rabbitmq.volume:/var/lib/rabbitmq
          HealthCmd=curl --fail http://localhost/healthcheck || exit 1
          HealthInterval=30s
          HealthRetries=5
          HealthStartPeriod=120s
          HealthTimeout=10s

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

      - name: opencloud.container
        content: |
          [Unit]
          Description=OpenCloud
          Requires=onlyoffice.service
          After=onlyoffice.service

          [Container]
          ContainerName=opencloud
          Image=docker.io/opencloudeu/opencloud:7.2.4
          User=3001:3001
          Pull=newer
          Network=opencloud.network
          NetworkAlias=opencloud
          DNS=10.6.13.1
          PublishPort=9200:9200
          Entrypoint=/bin/sh
          Exec=-c "set -e; if [ ! -f /etc/opencloud/opencloud.yaml ]; then opencloud init; fi; exec opencloud server"
          Environment=TZ=America/New_York
          Environment=OC_URL=https://cloud.internal.gormantech.com
          Environment=OC_LOG_LEVEL=info
          Environment=OC_LOG_COLOR=false
          Environment=OC_LOG_PRETTY=false
          Environment=PROXY_TLS=false
          Environment=PROXY_HTTP_ADDR=0.0.0.0:9200
          Environment=OC_INSECURE=false
          Environment=PROXY_ENABLE_BASIC_AUTH=false
          Environment=IDM_CREATE_DEMO_USERS=false
          Environment=FRONTEND_ARCHIVER_MAX_SIZE=10000000000
          Environment=FRONTEND_CHECK_FOR_UPDATES=true
          Environment=PROXY_CSP_CONFIG_FILE_LOCATION=/etc/opencloud/csp.yaml
          Environment=OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD=true
          Environment=OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD=false
          Environment=OC_PASSWORD_POLICY_DISABLED=false
          Environment=OC_PASSWORD_POLICY_MIN_CHARACTERS=8
          Environment=OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS=1
          Environment=OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS=1
          Environment=OC_PASSWORD_POLICY_MIN_DIGITS=1
          Environment=OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS=1
          Environment=OC_DEFAULT_LANGUAGE=en
          Environment=OC_ADD_RUN_SERVICES=collaboration
          Environment=FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR=eu.opencloud.api.collaboration
          Environment=GRAPH_AVAILABLE_ROLES=b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6
          Environment=COLLABORATION_WOPI_SRC=https://cloud.internal.gormantech.com
          Environment=COLLABORATION_APP_NAME=OnlyOffice
          Environment=COLLABORATION_APP_PRODUCT=OnlyOffice
          Environment=COLLABORATION_APP_ADDR=https://office.internal.gormantech.com
          Environment=COLLABORATION_APP_ICON=https://office.internal.gormantech.com/web-apps/apps/documenteditor/main/resources/img/favicon.ico
          Environment=COLLABORATION_APP_INSECURE=false
          Environment=COLLABORATION_CS3API_DATAGATEWAY_INSECURE=false
          Environment=COLLABORATION_APP_PROOF_DISABLE=true
          Secret=opencloud_admin_password,type=env,target=IDM_ADMIN_PASSWORD
          Volume=/srv/quadlet/opencloud:/etc/opencloud:Z
          Volume=opencloud-data.volume:/var/lib/opencloud
          Volume=/srv/quadlet/opencloud/apps:/var/lib/opencloud/web/assets/apps:Z

          [Service]
          Restart=always
          RestartSec=5
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target

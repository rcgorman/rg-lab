---
- name: Ensure OpenCloud config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "3001"
    group: "3001"
    mode: "0755"
  loop:
    - /srv/quadlet/opencloud
    - /srv/quadlet/opencloud/apps

- name: Ensure OpenCloud config ownership
  ansible.builtin.file:
    path: /srv/quadlet/opencloud
    state: directory
    owner: "3001"
    group: "3001"
    recurse: true

- name: Ensure Collabora config directory exists
  ansible.builtin.file:
    path: /srv/quadlet/opencloud-collabora
    state: directory
    owner: "1001"
    group: "1001"
    mode: "0750"

- name: Generate Collabora proof key
  ansible.builtin.command:
    cmd: openssl genrsa -out /srv/quadlet/opencloud-collabora/proof_key 4096
    creates: /srv/quadlet/opencloud-collabora/proof_key

- name: Ensure Collabora proof key ownership
  ansible.builtin.file:
    path: /srv/quadlet/opencloud-collabora/proof_key
    owner: "1001"
    group: "1001"
    mode: "0400"

- name: Restore OpenCloud config SELinux labels
  ansible.builtin.command:
    cmd: restorecon -RF /srv/quadlet/opencloud /srv/quadlet/opencloud-collabora
  changed_when: false

- name: Add OpenCloud quadlet units
  ansible.builtin.set_fact:
    quadlet_units: "{{ (quadlet_units | default([])) + opencloud_quadlet_units }}"

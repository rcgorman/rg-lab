---
- name: Validate OpenCloud secret configuration
  ansible.builtin.assert:
    that:
      - lookup('env', 'OPENCLOUD_ADMIN_PASSWORD') | length > 0
    fail_msg: Missing value for Podman secret opencloud_admin_password
  no_log: true

- name: Ensure OpenCloud config directory exists
  ansible.builtin.file:
    path: /srv/quadlet/opencloud
    state: directory
    owner: "3001"
    group: "3001"
    mode: "0755"

- name: Ensure OpenCloud config ownership
  ansible.builtin.file:
    path: /srv/quadlet/opencloud
    state: directory
    owner: "3001"
    group: "3001"
    recurse: true

- name: Deploy OpenCloud with the Podman system role
  ansible.builtin.include_role:
    name: fedora.linux_system_roles.podman
  vars:
    podman_run_as_user: root
    # Quadlet Pull= controls image acquisition; do not force-pull mutable tags.
    podman_pull_image: false
    podman_secrets:
      - name: opencloud_admin_password
        data: "{{ lookup('env', 'OPENCLOUD_ADMIN_PASSWORD') }}"
        force: "{{ podman_secrets_recreate | default(false) | bool }}"
        skip_existing: "{{ not (podman_secrets_recreate | default(false) | bool) }}"
        restarts:
          - opencloud
    # Dependencies must be listed before the container that uses them.
    podman_quadlet_specs:
      - template_src: "{{ playbook_dir }}/../roles/opencloud/templates/opencloud.network.j2"
      - template_src: "{{ playbook_dir }}/../roles/opencloud/templates/opencloud-data.volume.j2"
      - template_src: "{{ playbook_dir }}/../roles/opencloud/templates/opencloud.container.j2"

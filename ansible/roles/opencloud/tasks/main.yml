---
- name: Create opencloud secrets
  ansible.builtin.include_role:
    name: podman_secrets
  vars:
    podman_secrets_values:
      opencloud_admin_password: "{{ lookup('env', 'OPENCLOUD_ADMIN_PASSWORD') }}"
      onlyoffice_jwt_secret: "{{ lookup('env', 'ONLYOFFICE_JWT_SECRET') }}"

- name: Ensure OpenCloud config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "3001"
    group: "3001"
    mode: "0755"
  loop:
    - /srv/quadlet/opencloud
    - /srv/quadlet/opencloud/apps

- name: Install OpenCloud content security policy
  ansible.builtin.template:
    src: csp.yaml.j2
    dest: /srv/quadlet/opencloud/csp.yaml
    owner: "3001"
    group: "3001"
    mode: "0644"
  register: opencloud_csp

- name: Install OpenCloud application registry
  ansible.builtin.template:
    src: app-registry.yaml.j2
    dest: /srv/quadlet/opencloud/app-registry.yaml
    owner: "3001"
    group: "3001"
    mode: "0644"
  register: opencloud_app_registry

- name: Ensure OpenCloud config ownership
  ansible.builtin.file:
    path: /srv/quadlet/opencloud
    state: directory
    owner: "3001"
    group: "3001"
    recurse: true
  register: opencloud_config_ownership

- name: Deploy opencloud Quadlets
  ansible.builtin.include_role:
    name: podman_quadlet
  vars:
    podman_quadlet_restart_required: >-
      {{ podman_secrets_create.changed or opencloud_csp.changed
         or opencloud_app_registry.changed or opencloud_config_ownership.changed }}
    podman_quadlet_units:
      - name: opencloud.network
      - name: opencloud-data.volume
      - name: onlyoffice-data.volume
      - name: onlyoffice-lib.volume
      - name: onlyoffice-postgres.volume
      - name: onlyoffice-rabbitmq.volume
      - name: onlyoffice.container
      - name: opencloud.container

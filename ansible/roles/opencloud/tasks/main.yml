---
- name: Ensure OpenCloud config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "3001"
    group: "3001"
    mode: "0755"
  loop:
    - /srv/quadlet/opencloud
    - /srv/quadlet/opencloud/apps

- name: Install OpenCloud content security policy
  ansible.builtin.template:
    src: csp.yaml.j2
    dest: /srv/quadlet/opencloud/csp.yaml
    owner: "3001"
    group: "3001"
    mode: "0644"
  register: opencloud_csp

- name: Install OpenCloud application registry
  ansible.builtin.template:
    src: app-registry.yaml.j2
    dest: /srv/quadlet/opencloud/app-registry.yaml
    owner: "3001"
    group: "3001"
    mode: "0644"
  register: opencloud_app_registry

- name: Record OpenCloud configuration changes
  ansible.builtin.set_fact:
    podman_quadlet_restart_required: true
  when:
    - opencloud_csp.changed or opencloud_app_registry.changed

- name: Ensure OpenCloud config ownership
  ansible.builtin.file:
    path: /srv/quadlet/opencloud
    state: directory
    owner: "3001"
    group: "3001"
    recurse: true

- name: Restore OpenCloud config SELinux labels
  ansible.builtin.command:
    cmd: restorecon -RF /srv/quadlet/opencloud
  changed_when: false

- name: Add OpenCloud quadlet units
  ansible.builtin.set_fact:
    quadlet_units: "{{ (quadlet_units | default([])) + opencloud_quadlet_units }}"

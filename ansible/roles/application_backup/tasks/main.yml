---
- name: Validate application backup configuration
  ansible.builtin.assert:
    that:
      - application_backup_jobs | difference(application_backup_supported_jobs) | length == 0
      - application_backup_root | length > 1
      - application_backup_root != '/'
      - application_backup_retention_days | int > 0
    fail_msg: Invalid application backup configuration

- name: Ensure application backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ application_backup_root }}"
    - "{{ application_backup_libexec_dir }}"

- name: Install application backup scripts
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "{{ application_backup_libexec_dir }}/rg-backup-{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: "{{ application_backup_jobs }}"
  notify: Reload systemd for application backups

- name: Install application backup services
  ansible.builtin.template:
    src: application-backup.service.j2
    dest: "/etc/systemd/system/rg-backup-{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ application_backup_jobs }}"
  notify: Reload systemd for application backups

- name: Apply application backup unit changes
  ansible.builtin.meta: flush_handlers
